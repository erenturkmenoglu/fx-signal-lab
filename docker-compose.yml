# FX Signal Lab - single-host deployment.
#
#   cp .env.example .env    # set POSTGRES_PASSWORD and MASSIVE_API_KEY
#   docker compose up -d --build
#   open http://127.0.0.1:8000
#
# Both services restart automatically (crash, reboot).  Data lives in the named volume
# `pgdata` and survives `docker compose down`; only `down -v` deletes it.

name: fx-signal-lab

services:
  db:
    image: timescale/timescaledb:2.26.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fxlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fxlab
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # One file, not the folder: mounting a folder here would hide the image's own
      # first-start scripts (extension set-up, TIMESCALEDB_TELEMETRY, timescaledb-tune).
      - ./scripts/db-init/10-mock-database.sql:/docker-entrypoint-initdb.d/10-mock-database.sql:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxlab -d fxlab"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # The database is not published by default.  To reach it from the host (psql, backups
    # with a local client), uncomment:
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # one database per data mode: FXLAB_DB=fxlab for Massive, fxlab_mock for DATA_PROVIDER=mock
      DATABASE_URL: postgresql+asyncpg://fxlab:${POSTGRES_PASSWORD}@db:5432/${FXLAB_DB:-fxlab}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    volumes:
      - ./config:/app/config:ro
    ports:
      # Bound to localhost on purpose: the dashboard has no authentication yet.
      # For access from a phone or another machine see docs/DEPLOY.md (Tailscale).
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    stop_grace_period: 45s

volumes:
  pgdata:
