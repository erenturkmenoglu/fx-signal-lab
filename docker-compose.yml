# FX Signal Lab - single-host deployment.
#
#   cp .env.example .env    # set POSTGRES_PASSWORD and MASSIVE_API_KEY
#   docker compose up -d --build
#   open http://127.0.0.1:8000
#
# Both services restart automatically (crash, reboot).  Data lives in the named volume
# `pgdata` and survives `docker compose down`; only `down -v` deletes it.
#
# A third service, `caddy`, serves the dashboard on a domain of your own with HTTPS.  It
# belongs to the profile "domain" and is not started unless `make domain` has turned that
# profile on in .env (docs/DEPLOY.md, "A domain of your own").

name: fx-signal-lab

services:
  db:
    image: timescale/timescaledb:2.26.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fxlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fxlab
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # One file, not the folder: mounting a folder here would hide the image's own
      # first-start scripts (extension set-up, TIMESCALEDB_TELEMETRY, timescaledb-tune).
      - ./scripts/db-init/10-mock-database.sql:/docker-entrypoint-initdb.d/10-mock-database.sql:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxlab -d fxlab"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # The database is not published by default.  To reach it from the host (psql, backups
    # with a local client), uncomment:
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # one database per data mode: FXLAB_DB=fxlab for Massive, fxlab_mock for DATA_PROVIDER=mock
      DATABASE_URL: postgresql+asyncpg://fxlab:${POSTGRES_PASSWORD}@db:5432/${FXLAB_DB:-fxlab}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    volumes:
      - ./config:/app/config:ro
    ports:
      # Bound to localhost on purpose: whatever reaches the dashboard from outside (Tailscale,
      # or Caddy below for a domain of your own) comes through this machine, not past it.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    stop_grace_period: 45s

  caddy:
    # Only with a domain of your own.  Caddy gets the certificate, renews it, sends http on
    # to https and passes everything else to the application (Caddyfile).
    profiles: ["domain"]
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
    command:
      - sh
      - -c
      - |
        if [ -z "$$DASHBOARD_DOMAIN" ]; then
          echo "DASHBOARD_DOMAIN is not set: turn the domain on with 'make domain ARGS=your.name'" >&2
          exit 78
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    # it faces the internet: no more rights inside its container than binding the two ports
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      # the only ports of this stack that are open to the world
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # certificates and the account they were issued to: keep, or every restart asks for new ones
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
