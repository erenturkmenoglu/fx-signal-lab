[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxlab"
version = "0.1.0"
description = "FX Signal Lab - FX research, backtesting and real-time decision-support platform (Phase 1: data infrastructure)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=15.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
fxlab = "fxlab.cli:main"

[tool.setuptools.packages.find]
include = ["fxlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"
markers = [
    "db: needs a PostgreSQL database (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity/magic-number noise
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PLR", "DTZ", "ASYNC", "E501", "PLC0415", "RUF018"]
"fxlab/cli.py" = ["PLC0415"]  # lazy imports keep `fxlab instruments` etc. fast

[tool.mypy]
python_version = "3.12"
packages = ["fxlab"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
