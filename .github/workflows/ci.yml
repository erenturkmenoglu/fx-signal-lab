name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        # the same image as production, so the TimescaleDB paths of the migration and of the
        # storage policies are exercised on every push
        image: timescale/timescaledb:2.26.1-pg16
        env:
          POSTGRES_USER: fxlab
          POSTGRES_PASSWORD: fxlab
          POSTGRES_DB: fxlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fxlab -d fxlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fxlab:fxlab@127.0.0.1:5432/fxlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check fxlab tests
      - run: ruff format --check fxlab tests migrations
      - run: mypy
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    # Builds the image and runs the Compose stack the way a server does: once without an API
    # key (nothing may be collected), once on the built-in simulator (data must flow and reach
    # the database).  No secret is needed, and Massive is never contacted.
    runs-on: ubuntu-latest
    env:
      # with the memory limits of the smallest supported server (see the second file)
      COMPOSE_FILE: docker-compose.yml:.github/compose.small-server.yml
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: shellcheck scripts/server-setup.sh scripts/set-password.sh scripts/set-domain.sh .github/wait-ready.sh .github/report-stack.sh .github/mem-peak.sh
      - name: Both Compose configurations are valid (the server's, and the one with CI limits), with and without a domain
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose config --quiet
          docker compose -f docker-compose.yml --profile domain config --quiet
          docker compose --profile domain config --quiet
          # Caddy belongs to the stack only when the profile is on
          test "$(docker compose config --services | sort | tr '\n' ' ')" = "app db "
          test "$(docker compose --profile domain config --services | sort | tr '\n' ' ')" = "app caddy db "
      - name: Build and start without an API key
        run: ./.github/mem-peak.sh "first pull, build and start" docker compose up -d --build
      - name: Wait for the application
        run: ./.github/wait-ready.sh
      - name: Without a key nothing is collected
        run: |
          curl -fsS http://127.0.0.1:8000/api/status | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert s['provider']['label'] == 'NOT CONFIGURED', s['provider']
          assert s['storage']['timescaledb'] is True, s['storage']
          assert s['storage']['policy_errors'] == [], s['storage']
          assert s['instruments'][0]['signal_gate']['allowed'] is False
          print('ok:', s['provider']['label'], '| timescaledb:', s['storage']['timescaledb'])"
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          test "$(docker compose exec -T db psql -U fxlab -d fxlab -Atc 'select count(*) from obs_1s')" = "0"
      - name: The database ran its own first-start scripts (telemetry off, tuned for 2 GB)
        run: |
          settings="$(docker compose exec -T db psql -U fxlab -d fxlab -Atc "
            select string_agg(name || '=' || current_setting(name), ' ' order by name) from pg_settings
            where name in ('max_connections', 'max_worker_processes', 'shared_buffers', 'timescaledb.telemetry_level')")"
          echo "$settings"
          test "$settings" = "max_connections=25 max_worker_processes=21 shared_buffers=475MB timescaledb.telemetry_level=off"
      - name: Restart on the simulator (its own database)
        run: |
          sed -i -e 's/^DATA_PROVIDER=.*/DATA_PROVIDER=mock/' -e 's/^FXLAB_DB=.*/FXLAB_DB=fxlab_mock/' .env
          docker compose up -d
          ./.github/wait-ready.sh
      - name: Simulated quotes flow into the database, labelled as mock
        run: |
          sleep 15
          curl -fsS http://127.0.0.1:8000/api/status | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert s['provider']['label'] == 'MOCK' and s['provider']['synthetic'] is True, s['provider']
          assert s['connection']['state'] == 'streaming', s['connection']
          assert s['storage']['policy_errors'] == [], s['storage']
          print('ok:', s['provider']['label'], '|', s['connection']['state'])"
          rows="$(docker compose exec -T db psql -U fxlab -d fxlab_mock -Atc "select count(*) from obs_1s where source = 'mock'")"
          echo "mock observations stored: $rows"
          test "$rows" -ge 5
          test "$(docker compose exec -T db psql -U fxlab -d fxlab -Atc 'select count(*) from obs_1s')" = "0"
      - name: A restart is clean
        run: |
          docker compose restart app
          ./.github/wait-ready.sh
          test "$(docker compose logs app | grep -c '"level": "error"')" = "0"
      - name: A backup restores into an empty database
        run: |
          docker compose stop app
          make backup DB=fxlab_mock
          docker compose exec -T db psql -U fxlab -d postgres -qc "CREATE DATABASE restore_test OWNER fxlab"
          make restore DB=restore_test FILE="$(ls backups/fxlab_mock-*.dump)"
          facts() {
            docker compose exec -T db psql -U fxlab -d "$1" -Atc "
              select (select count(*) from quote_ticks) || ' ticks, ' || (select count(*) from obs_1s) || ' seconds, '
                || (select count(*) from bars) || ' bars, '
                || (select count(*) from pg_constraint where contype = 'f' and connamespace = 'public'::regnamespace) || ' foreign keys, '
                || (select count(*) from timescaledb_information.jobs where hypertable_name is not null) || ' policies, restore mode '
                || current_setting('timescaledb.restoring')"
          }
          echo "source:   $(facts fxlab_mock)"
          echo "restored: $(facts restore_test)"
          test "$(facts fxlab_mock)" = "$(facts restore_test)"
          test "$(docker compose exec -T db psql -U fxlab -d restore_test -Atc 'select count(*) from obs_1s')" -ge 5
          docker compose start app
          ./.github/wait-ready.sh
      - name: A password closes the API, a login opens it
        run: |
          DASHBOARD_PASSWORD='ci only passphrase 2026' ./scripts/set-password.sh
          grep -q '^DASHBOARD_PASSWORD_HASH=pbkdf2_sha256:' .env
          if grep -q 'ci only passphrase' .env; then echo "the password itself is in .env"; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/status)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)" = "404"
          curl -fsS -o /dev/null http://127.0.0.1:8000/api/health/ready
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"password":"not the passphrase"}' http://127.0.0.1:8000/api/auth/login)" = "401"
          # log in as a browser does; the cookie is for HTTPS only, so it is handed over by hand here
          cookie="$(curl -fsS -D - -o /dev/null -H 'Content-Type: application/json' \
            -d '{"password":"ci only passphrase 2026"}' http://127.0.0.1:8000/api/auth/login | tr -d '\r' | grep -i '^set-cookie: fxlab_session=')"
          echo "$cookie" | grep -q 'HttpOnly'
          echo "$cookie" | grep -q 'Secure'
          echo "$cookie" | grep -qi 'SameSite=strict'
          token="$(echo "$cookie" | sed 's/^[^=]*=\([^;]*\);.*/\1/')"
          curl -fsS -H "Cookie: fxlab_session=$token" http://127.0.0.1:8000/api/status | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert s['provider']['label'] == 'MOCK', s['provider']
          print('ok: logged in, data label', s['provider']['label'])"
          # the command line inside the container shares the secret and keeps working
          docker compose exec -T app python -m fxlab.cli gaps scan | grep -q queued
          ./scripts/set-password.sh --remove
          curl -fsS -o /dev/null http://127.0.0.1:8000/api/status
      - name: A backtest runs in the container on stored history
        run: |
          # four weeks of one-minute provider bars (a slow wave with a faster one on top) for the hours the
          # market is open: Sunday 21:00 to Friday 21:00 UTC in October.  No result on them means anything;
          # they are rows of the kind a history download writes.
          docker compose exec -T db psql -U fxlab -d fxlab_mock -v ON_ERROR_STOP=1 -qc "
            insert into bars (instrument_id, timeframe, source, ts, open, high, low, close, price_basis)
            select (select id from instruments where symbol = 'EURUSD'), '1m', 'massive_agg', ts,
                   round(p::numeric, 5), round((p + 0.0002)::numeric, 5), round((p - 0.0002)::numeric, 5),
                   round((p + 0.0001)::numeric, 5), 'bid'
            from (select ts, extract(isodow from ts at time zone 'UTC') as dow, extract(hour from ts at time zone 'UTC') as hour,
                         1.16 + 0.004 * sin(extract(epoch from ts) / 3000) + 0.0015 * sin(extract(epoch from ts) / 400) as p
                  from generate_series('2026-10-05 00:00+00'::timestamptz, '2026-10-30 20:59+00', interval '1 minute') ts) wave
            where not (dow = 6 or (dow = 5 and hour >= 21) or (dow = 7 and hour < 21))"
          make strategies | grep -q '^rsi_reversion '
          make backtest ARGS="--strategy bollinger_reversion --days 3" | tee backtest.txt
          grep -q '^Bollinger reversion on EURUSD, 5m bars (trades simulated on 1m bid bars)' backtest.txt
          grep -q '20 trading days, 28,620 bars' backtest.txt
          docker compose exec -T app python -m fxlab.cli backtest --strategy rsi_reversion --json > backtest.json
          python3 -c "
          import json
          r = json.load(open('backtest.json'))
          assert r['data']['price_basis'] == 'bid' and r['data']['base_bars'] == 28620, r['data']
          assert r['summary']['trades'] > 10 and r['signals']['signals'] > 50, (r['summary']['trades'], r['signals'])
          assert 'in_sample' in r and 'out_of_sample' in r, sorted(r)
          # the rules of the instrument: one order per position, a stop as near as the target
          ex = r['request']['execution']
          assert (ex['max_clips'], ex['stop_pips'], ex['target_pips']) == (1, 5.0, 5.0), ex
          assert r['summary']['max_units'] == 1000000 and 'without_adding' not in r, r['summary']['max_units']
          assert all(t['entry_price'] < 2 for t in r['trades']), 'a price that is not from the provider bars'
          print('ok:', r['summary']['trades'], 'trades on', r['data']['trading_days'], 'days')"
          # nothing stored for an instrument: the command says what to download and fails
          if docker compose exec -T app python -m fxlab.cli backtest --strategy rsi_reversion --symbol USDJPY 2> refused.txt; then
            echo "a backtest without history did not fail"; exit 1
          fi
          grep -q 'no 1m history of USDJPY is stored. Download it first: fxlab history' refused.txt
      - name: The strategy lab answers over HTTP
        run: |
          curl -fsS http://127.0.0.1:8000/api/lab | python3 -c "
          import json, sys
          lab = json.load(sys.stdin)
          assert [h['timeframe'] for h in lab['history']] == ['1m'] and lab['history'][0]['bars'] == 28620, lab['history']
          assert len(lab['strategies']) >= 4 and lab['execution']['spread_pips'] == 1.0, lab['execution']
          print('ok:', len(lab['strategies']), 'strategies,', lab['history'][0]['bars'], 'bars stored')"
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"symbol": "EURUSD", "strategy": "ema_momentum", "start": "2026-10-05", "end": "2026-10-31", "execution": {"min_potential_pips": 0}}' \
            http://127.0.0.1:8000/api/backtests > lab.json
          python3 -c "
          import json
          r = json.load(open('lab.json'))
          assert r['request']['strategy'] == 'ema_momentum' and r['data']['base_bars'] == 28620, r['data']
          assert r['summary']['trades'] > 5 and len(r['daily']) == 20, (r['summary']['trades'], len(r['daily']))
          assert all('first_bar_ms' in d for d in r['daily'])
          print('ok:', r['summary']['trades'], 'trades over HTTP')"
          # the bars the price chart of a day asks for
          curl -fsS 'http://127.0.0.1:8000/api/bars?symbol=EURUSD&timeframe=1m&source=provider&start=2026-10-06T00:00:00Z&end=2026-10-07T00:00:00Z&limit=20000' \
            | python3 -c "import json, sys; b = json.load(sys.stdin); assert len(b['bars']) == 1440 and b['price_basis'] == 'bid', len(b['bars'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"symbol": "EURUSD", "strategy": "martingale", "start": "2026-10-05", "end": "2026-10-31"}' \
            http://127.0.0.1:8000/api/backtests)" = "400"
          # the live feed of the same process is still running
          curl -fsS http://127.0.0.1:8000/api/status | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert s['connection']['state'] == 'streaming', s['connection']"
      - name: The signal board runs every method in the background
        run: |
          # three weeks, with the week before them stored: that week is the run-in
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"symbol": "EURUSD", "start": "2026-10-12", "end": "2026-10-31"}' \
            http://127.0.0.1:8000/api/board/runs > /dev/null
          for _ in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8000/api/board > state.json
            python3 -c "import json, sys; sys.exit(json.load(open('state.json'))['run']['status'] == 'running')" && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/board/result > board.json
          # the signals of the last week of it, as the chart of the page asks for them
          python3 -c "
          import json
          board = json.load(open('board.json'))
          first, last = board['day_spans'][-5][0], board['day_spans'][-1][1] + 60000
          from datetime import datetime, timezone
          iso = lambda ms: datetime.fromtimestamp(ms / 1000, timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          json.dump({'symbol': 'EURUSD', 'start': iso(first), 'end': iso(last), 'chart_timeframe': '5m'}, open('ask.json', 'w'))"
          curl -fsS -H 'Content-Type: application/json' -d @ask.json http://127.0.0.1:8000/api/board/signals > window.json
          python3 -c "
          import json
          state, board, window = (json.load(open(name)) for name in ('state.json', 'board.json', 'window.json'))
          run = state['run']
          assert run['status'] == 'done' and run['error'] is None, run
          assert run['done'] == run['total'] == len(board['combos']) > 60, (run, len(board['combos']))
          assert len(board['days']) == 15 and board['days'][0] == '2026-10-12', board['days']
          assert board['data']['run_in_from'] is not None and board['data']['run_in_from'] < '2026-10-12', board['data']
          assert any(c['family'] == 'benchmark' for c in board['combos'])
          rules = board['variants'][0]  # 'one': a position is one order (the instrument's rules)
          assert board['variants'] == ['one'] and board['request']['execution']['max_clips'] == 1, board['variants']
          assert sum(c[rules]['trades'] for c in board['combos']) > 200
          assert all(c[rules]['largest_loss'] is None or c[rules]['largest_loss'] >= -1500 for c in board['combos'])
          # the trades of the window are the trades the board counts for those days
          spans = board['day_spans'][-5:]
          def day(ms):
              return next(k for k, (a, b) in enumerate(spans) if a <= ms <= b + 60000)
          for combo in board['combos']:
              got = [0] * 5
              for s in window['signals']:
                  if s['method'] == combo['id'] and 'pnl' in s:
                      got[day(s['exit_ms'])] += 1
              assert got == combo[rules]['daily']['trades'][-5:], (combo['id'], got, combo[rules]['daily']['trades'][-5:])
          assert len(window['bars']['t']) > 1000 and len(window['methods']) == len(board['combos'])
          # under the chart, bar by bar: what the momentum methods said, the mean-reversion signals, the trend channel
          context, bars = window['context'], len(window['bars']['t'])
          kinds = {m['id']: m['style'] for m in window['methods']}
          assert context['voters'] == sum(1 for kind in kinds.values() if kind == 'momentum') == 40, context['voters']
          assert all(len(context[k]) == bars for k in ('votes', 'state')), 'one reading for every bar'
          assert all(len(context['channel'][k]) == bars for k in ('middle', 'upper', 'lower'))
          assert all(lo < mid < up for lo, mid, up in zip(*(context['channel'][k] for k in ('lower', 'middle', 'upper'))))
          # ... and the straight channel of the whole window, for the eye: nearly every close lies inside it
          line = context['channel']['straight']
          at = lambda i: line['start'] + (line['end'] - line['start']) * i / (bars - 1)
          inside = sum(1 for i, close in enumerate(window['bars']['c']) if abs(close - at(i)) <= line['half'])
          assert line['bars'] == bars and line['half'] > 0 and inside > 0.9 * bars, (line, inside, bars)
          assert set(context['state']) == {1, -1} and len(context['changes']) > 5, len(context['changes'])
          reversion = sum(1 for s in window['signals'] if kinds[s['method']] == 'reversion')
          assert sum(context['reversion']['buys']) + sum(context['reversion']['sells']) == reversion > 100, reversion
          print('ok:', len(board['combos']), 'methods,', sum(c[rules]['trades'] for c in board['combos']), 'trades,',
                len(window['signals']), 'signals in the last week,', len(context['changes']), 'changes of momentum')"
          # the page asks for the window without the list of signals: the same context, a fraction of the size
          python3 -c "
          import json
          json.dump({**json.load(open('ask.json')), 'list_signals': False}, open('ask_short.json', 'w'))"
          curl -fsS -H 'Content-Type: application/json' -d @ask_short.json http://127.0.0.1:8000/api/board/signals > short.json
          python3 -c "
          import json, os
          window, short = json.load(open('window.json')), json.load(open('short.json'))
          assert short['signals'] is None and short['signal_count'] == len(window['signals']), short['signal_count']
          assert short['context'] == window['context'] and short['bars'] == window['bars']
          assert os.path.getsize('short.json') < os.path.getsize('window.json') / 3"
          # a second run cannot be started with a broken request, and the feed is still streaming
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"symbol": "EURUSD", "start": "2026-10-12", "end": "2026-10-31", "strategies": ["martingale"]}' \
            http://127.0.0.1:8000/api/board/runs)" = "400"
          curl -fsS http://127.0.0.1:8000/api/status | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert s['connection']['state'] == 'streaming', s['connection']"
      - name: A setup of one's own is saved, run and asked why its trades failed
        run: |
          # saved under its name, read back, and run over the three weeks of the board
          curl -fsS -X PUT -H 'Content-Type: application/json' \
            -d '{"name": "RSI or Bollinger", "methods": ["rsi_reversion@5m", "bollinger_reversion@5m"], "mode": "any", "execution": {"target_pips": 5, "stop_pips": 5, "min_potential_pips": 0}}' \
            http://127.0.0.1:8000/api/setups > saved.json
          curl -fsS http://127.0.0.1:8000/api/setups > list.json
          python3 -c "
          import json
          saved, listed = json.load(open('saved.json')), json.load(open('list.json'))
          assert listed == [saved] and saved['id'] == 1 and saved['mode'] == 'any', listed
          kept = {k: saved[k] for k in ('name', 'methods', 'mode', 'within_minutes', 'skip', 'execution')}
          period = {'symbol': 'EURUSD', 'start': '2026-10-12', 'end': '2026-10-31'}
          json.dump({**period, **kept}, open('setup.json', 'w'))
          # the same rule without the trades against the momentum, and one of its methods alone
          json.dump({**period, **kept, 'skip': ['against_momentum']}, open('setup_skip.json', 'w'))
          json.dump({**period, **kept, 'methods': ['rsi_reversion@5m']}, open('setup_one.json', 'w'))
          alone = {**period, 'strategy': 'rsi_reversion', 'timeframe': '5m', 'execution': kept['execution']}
          json.dump(alone, open('alone.json', 'w'))"
          for name in setup setup_skip setup_one; do
            curl -fsS -H 'Content-Type: application/json' -d @$name.json http://127.0.0.1:8000/api/setups/run > $name.out.json
          done
          curl -fsS -H 'Content-Type: application/json' -d @alone.json http://127.0.0.1:8000/api/backtests > alone.out.json
          python3 -c "
          import json
          names = ('setup', 'setup_skip', 'setup_one', 'alone')
          report, skipped, one, alone = (json.load(open(name + '.out.json')) for name in names)
          ex = report['request']['execution']
          assert (ex['max_clips'], ex['stop_pips'], ex['target_pips']) == (1, 5.0, 5.0), ex
          trades = report['trades']
          assert len(trades) == report['summary']['trades'] > 50 and len(report['daily']) == 15, len(trades)
          assert all(t['pnl'] >= -600 for t in trades), 'a loss larger than the stop'
          # every trade is described, and the table of reasons counts each of them once per condition
          keys = [c['key'] for c in report['context']['conditions']]
          assert keys[:3] == ['against_momentum', 'against_channel', 'outside_channel'] and len(keys) == 5, keys
          assert all(isinstance(t[k], bool) for t in trades for k in keys)
          why = report['why']
          assert why['trades'] == len(trades) and why['failed'] == sum(1 for t in trades if t['pnl'] < 0), why['failed']
          for c in why['conditions']:
              assert c['with']['trades'] == sum(1 for t in trades if t[c['key']]), c
              assert c['with']['trades'] + c['without']['trades'] == len(trades), c
          assert report['context']['voters'] == 40 and report['context']['grid'] == '5m', report['context']
          # without the trades against the momentum: fewer trades, and none of that kind is left
          assert 0 < skipped['summary']['trades'] < len(trades), skipped['summary']['trades']
          assert not any(t['against_momentum'] for t in skipped['trades'])
          assert skipped['signals']['skipped: against the momentum when it was opened'] > 0, skipped['signals']
          # one method alone is that method's backtest, trade for trade
          fields = ('signal_ms', 'entry_ms', 'exit_ms', 'direction', 'entry_price', 'exit_price', 'pnl', 'reason')
          strip = lambda t: [t[k] for k in fields]
          assert [strip(t) for t in one['trades']] == [strip(t) for t in alone['trades']] and len(one['trades']) > 20
          assert one['summary'] == alone['summary']
          print('ok:', len(trades), 'trades,', why['failed'], 'failed;', skipped['summary']['trades'],
                'when those against the momentum are left out')"
          # what cannot be run is refused; a deleted setup is gone
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"symbol": "EURUSD", "start": "2026-10-12", "end": "2026-10-31", "methods": ["martingale@5m"]}' \
            http://127.0.0.1:8000/api/setups/run)" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:8000/api/setups/1)" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:8000/api/setups/1)" = "404"
          test "$(curl -fsS http://127.0.0.1:8000/api/setups)" = "[]"
      - name: Nothing ran out of memory inside the limits
        run: ./.github/report-stack.sh check
      - name: A domain of its own needs a password, is served over HTTPS by Caddy and can be turned off again
        run: |
          changed() { grep -q -e '^DASHBOARD_DOMAIN=' -e '^COMPOSE_PROFILES=' .env; }
          # without a password nothing is changed
          if ./scripts/set-domain.sh fxlab.localhost > domain.txt 2>&1; then echo "a domain was set without a password"; exit 1; fi
          grep -q 'no dashboard password is set' domain.txt
          if changed; then echo ".env was changed"; exit 1; fi
          DASHBOARD_PASSWORD='ci only passphrase 2026' ./scripts/set-password.sh
          # a name without an address and a name that points at another server are refused
          if ./scripts/set-domain.sh nonexistent.invalid > domain.txt 2>&1; then echo "a name without an address was accepted"; exit 1; fi
          grep -q 'nonexistent.invalid has no address yet' domain.txt
          echo '203.0.113.7 dns-ok.fxlab.test' | sudo tee -a /etc/hosts > /dev/null
          if FXLAB_PUBLIC_IP=203.0.113.8 ./scripts/set-domain.sh dns-ok.fxlab.test > domain.txt 2>&1; then echo "a name that points elsewhere was accepted"; exit 1; fi
          grep -q "dns-ok.fxlab.test points at 203.0.113.7, but this server's public address is 203.0.113.8" domain.txt
          FXLAB_PUBLIC_IP=203.0.113.7 ./scripts/set-domain.sh --check dns-ok.fxlab.test > domain.txt
          grep -q "dns-ok.fxlab.test points at 203.0.113.7, this server's public address" domain.txt
          # the same check with the address of this runner looked up, as on a server
          ./scripts/set-domain.sh --check dns-ok.fxlab.test > domain.txt 2>&1 || true
          cat domain.txt
          grep -Eq "but this server's public address is [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.|could not be looked up" domain.txt
          if changed || docker compose --profile domain ps -a --services | grep -qx caddy; then echo "a refused name left something behind"; exit 1; fi

          # a trial name: Caddy signs the certificate itself, everything else is as with a real name
          ./scripts/set-domain.sh fxlab.localhost
          grep -q '^DASHBOARD_DOMAIN=fxlab.localhost$' .env && grep -q '^COMPOSE_PROFILES=domain$' .env
          docker compose ps
          docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > caddy-root.crt
          via() { curl -sS --noproxy '*' --cacert caddy-root.crt --resolve fxlab.localhost:443:127.0.0.1 --resolve fxlab.localhost:80:127.0.0.1 "$@"; }
          test "$(via -o /dev/null -w '%{http_code} %{redirect_url}' 'http://fxlab.localhost/lab?day=1')" = "308 https://fxlab.localhost/lab?day=1"
          test "$(via -o /dev/null -w '%{http_code}' https://fxlab.localhost/api/health/ready)" = "200"
          via -f -o /dev/null https://fxlab.localhost/
          test "$(via -o /dev/null -w '%{http_code}' https://fxlab.localhost/api/status)" = "401"
          test "$(via -o /dev/null -w '%{http_code}' https://fxlab.localhost/docs)" = "404"
          # the application's own headers arrive, and the answer does not name the programs behind it
          via -D - -o /dev/null https://fxlab.localhost/ | tr -d '\r' > headers.txt
          grep -qi '^strict-transport-security: max-age=31536000' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          grep -qi "^content-security-policy: default-src 'self'" headers.txt
          if grep -qi -e '^server:' -e '^via:' headers.txt; then echo "the answer names its server"; exit 1; fi
          # a name that is not the dashboard's gets no answer from the same address
          if curl -s --noproxy '*' -k --max-time 5 --resolve other.localhost:443:127.0.0.1 -o /dev/null https://other.localhost/; then
            echo "another name was served"; exit 1
          fi
          # log in as a browser does: over HTTPS the client keeps the cookie itself
          test "$(via -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"password":"not the passphrase"}' https://fxlab.localhost/api/auth/login)" = "401"
          via -f -c jar.txt -o /dev/null -H 'Content-Type: application/json' \
            -d '{"password":"ci only passphrase 2026"}' https://fxlab.localhost/api/auth/login
          via -f -b jar.txt https://fxlab.localhost/api/status | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert s['provider']['label'] == 'MOCK' and s['connection']['state'] == 'streaming', (s['provider'], s['connection'])
          print('ok: logged in over HTTPS, data label', s['provider']['label'])"
          # a day of bars travels compressed
          day='https://fxlab.localhost/api/bars?symbol=EURUSD&timeframe=1m&source=provider&start=2026-10-06T00:00:00Z&end=2026-10-07T00:00:00Z&limit=20000'
          plain="$(via -f -b jar.txt -o /dev/null -w '%{size_download}' "$day")"
          packed="$(via -f -b jar.txt -o /dev/null -w '%{size_download}' -H 'Accept-Encoding: gzip' "$day")"
          echo "a day of one-minute bars: $plain bytes, $packed compressed"
          test "$plain" -gt 50000 && test "$packed" -lt $((plain / 3))
          # the live stream is a WebSocket: it has to pass the proxy, and only with a session
          token="$(awk '$6 == "fxlab_session" {print $7}' jar.txt)"
          docker compose exec -T -e ROOT_PEM="$(cat caddy-root.crt)" app python - fxlab.localhost caddy "$token" < .github/live-through-proxy.py
          # the application knows it is public, and the login cannot be taken away while it is
          test "$(docker compose exec -T app python -c 'from fxlab.config import get_settings; print(get_settings().dashboard_domain)')" = "fxlab.localhost"
          if ./scripts/set-password.sh --remove > domain.txt 2>&1; then echo "the login was removed from a public address"; exit 1; fi
          grep -q 'Turn the domain off first' domain.txt
          test "$(via -o /dev/null -w '%{http_code}' https://fxlab.localhost/api/status)" = "401"
          # running it again changes nothing; Caddy stays inside its memory limit and was not restarted
          ./scripts/set-domain.sh fxlab.localhost
          ./.github/report-stack.sh check

          # off again: no container, no open port, no setting; the application is still closed
          ./scripts/set-domain.sh --remove
          if changed; then echo "the settings are still in .env"; exit 1; fi
          test -z "$(docker compose --profile domain ps -a -q caddy)"
          if curl -s --noproxy '*' -k --max-time 5 --resolve fxlab.localhost:443:127.0.0.1 -o /dev/null https://fxlab.localhost/; then
            echo "port 443 still answers"; exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/status)" = "401"
          ./scripts/set-password.sh --remove
          curl -fsS -o /dev/null http://127.0.0.1:8000/api/status
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail 120 || true
      - name: Clean up
        if: always()
        run: docker compose down -v || true
